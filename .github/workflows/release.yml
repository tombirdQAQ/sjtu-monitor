name: Release

# 推送 vX.Y.Z 标签时构建 交我选 原生客户端并创建草稿 Release;也可 workflow_dispatch
# 手动验证构建(不创建 Release,产物以 artifact 形式上传)。
#
# - Windows:WinUI 3 客户端(x64 / ARM64)的 Inno Setup 独立安装程序,以及提交
#   Microsoft Store 用的 MSIX bundle。后端 sidecar 为 x64 冻结产物,ARM64 设备经仿真运行。
# - macOS:SwiftUI 客户端 DMG,仅 Apple Silicon。onnxruntime 自 1.24 起只发
#   macosx_14_0_arm64 wheel,Intel Mac 无法用同一套依赖构建。未做 Developer ID 签名与公证,
#   用户首次打开需右键“打开”或 `xattr -dr com.apple.quarantine /Applications/交我选.app`。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify release version alignment
        run: node scripts/check-release-version.mjs

      # 冻结 Python 后端:setup-python 用 python.org 构建,_ctypes 等原生依赖自带。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build backend sidecar (PyInstaller)
        shell: pwsh
        run: |
          Remove-Item -LiteralPath src-tauri/resources/sjtu-backend -Recurse -Force -ErrorAction SilentlyContinue
          python -m PyInstaller sjtu-backend.spec --distpath src-tauri/resources --noconfirm

      # 离线自检:确认冻结产物能加载原生依赖、以 UTF-8 输出中文,且包含 ng 服务模块。
      - name: Verify sidecar
        run: python -c "import subprocess; p=subprocess.run(['src-tauri/resources/sjtu-backend/sjtu-backend.exe', 'selfcheck'], stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True); text=p.stdout.decode('utf-8'); assert '中文编码验证：交我选' in text, text"

      - name: Verify ng service in sidecar
        shell: pwsh
        run: |
          $request = '{"id":1,"method":"hello","params":{}}'
          $env:SJTU_MONITOR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'ng-data'
          New-Item -ItemType Directory -Force -Path $env:SJTU_MONITOR_DATA_DIR | Out-Null
          $output = $request | & src-tauri/resources/sjtu-backend/sjtu-backend.exe ng_service.py
          $output
          if (-not ($output -match '"protocol":1')) { throw "sidecar 未返回 ng_service hello" }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish app (x64, ARM64)
        shell: pwsh
        run: |
          pwsh -File packaging/windows/publish.ps1 -Architecture x64
          pwsh -File packaging/windows/publish.ps1 -Architecture arm64

      - name: Build installers (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          foreach ($arch in 'x64', 'arm64') {
            & $iscc "/DAppVersion=$version" "/DArch=$arch" packaging/windows/installer.iss
            if ($LASTEXITCODE -ne 0) { throw "ISCC $arch 失败" }
          }

      - name: Build Microsoft Store MSIX bundle
        shell: pwsh
        env:
          MSIX_CERTIFICATE_BASE64: ${{ secrets.MSIX_CERTIFICATE_BASE64 }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $msixVersion = "$version.0"
          $output = "build/windows/JiaoWoXuan-$version-store.msixbundle"
          if (-not $env:MSIX_CERTIFICATE_BASE64 -or -not $env:MSIX_CERTIFICATE_PASSWORD) {
            if ($env:IS_TAG_RELEASE -eq 'true') {
              throw "标签发布缺少 MSIX_CERTIFICATE_BASE64 或 MSIX_CERTIFICATE_PASSWORD。请按 docs/microsoft-store.md 配置。"
            }
            pwsh -File packaging/build-msix.ps1 -Version $msixVersion -OutputPath $output -SkipSign
            exit $LASTEXITCODE
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'sjtu-monitor-store-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:MSIX_CERTIFICATE_BASE64))
          pwsh -File packaging/build-msix.ps1 -Version $msixVersion -OutputPath $output `
            -CertificatePath $certificatePath -CertificatePassword $env:MSIX_CERTIFICATE_PASSWORD

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/windows/*-setup.exe
            build/windows/*.msixbundle
          if-no-files-found: error

  build-macos:
    # Liquid Glass 等界面需要 macOS 26 SDK(Xcode 26)。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify release version alignment
        run: node scripts/check-release-version.mjs

      # Apple Silicon 运行器上 setup-python 装的是 arm64 解释器,与 onnxruntime 的 arm64 wheel 匹配。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build backend sidecar (PyInstaller)
        run: |
          rm -rf src-tauri/resources/sjtu-backend
          python -m PyInstaller sjtu-backend.spec --distpath src-tauri/resources --noconfirm

      - name: Verify sidecar
        run: |
          output=$(./src-tauri/resources/sjtu-backend/sjtu-backend selfcheck)
          echo "$output"
          case "$output" in
            *"中文编码验证：交我选"*) ;;
            *) echo "selfcheck 输出不符合预期"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/ng-data"
          hello=$(echo '{"id":1,"method":"hello","params":{}}' | SJTU_MONITOR_DATA_DIR="$RUNNER_TEMP/ng-data" ./src-tauri/resources/sjtu-backend/sjtu-backend ng_service.py)
          echo "$hello"
          case "$hello" in
            *'"protocol":1'*) ;;
            *) echo "sidecar 未返回 ng_service hello"; exit 1 ;;
          esac

      - name: Swift tests
        working-directory: ng/macos
        env:
          SJTU_MONITOR_PYTHON: ${{ env.pythonLocation }}/bin/python
        run: swift test

      - name: Build DMG
        run: bash ng/macos/package-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --draft \
            --title "交我选 ${{ github.ref_name }}" \
            --notes-file packaging/release-notes.md
